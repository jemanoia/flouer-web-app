name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "flouer-web-app/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "flouer-web-app/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  web-app:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flouer-web-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: flouer-web-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
